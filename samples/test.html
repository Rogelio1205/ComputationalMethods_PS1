<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Highlighted Source</title>
    <style>pre.code {background:#1e1b2b;color:#fff;padding:1rem;white-space:pre;overflow:auto;font-family:monospace;}
.keyword   {color:#c792ea;font-weight:bold}
.identifier{color:#ffffff}
.integer   {color:#f78c6c}
.float     {color:#f78c6c}
.string    {color:#c3e88d}
.comment   {color:#7f848e;font-style:italic}
.operator  {color:#89ddff}
.delimiter {color:#ff9d41}
.whitespace{color:inherit}</style>
  </head>
  <body>
    <pre class="code"><span class="keyword">def</span> <span class="identifier">factorial</span><span class="delimiter">(</span><span class="identifier">n</span><span class="delimiter">)</span><span class="delimiter">:</span>
    <span class="keyword">if</span> <span class="identifier">n</span> <span class="operator">==</span> <span class="integer">0</span><span class="delimiter">:</span>
        <span class="keyword">return</span> <span class="integer">1</span>
    <span class="keyword">else</span><span class="delimiter">:</span>
        <span class="keyword">return</span> <span class="identifier">n</span> <span class="operator">*</span> <span class="identifier">factorial</span><span class="delimiter">(</span><span class="identifier">n</span> <span class="operator">-</span> <span class="integer">1</span><span class="delimiter">)</span>


<span class="identifier">print</span><span class="delimiter">(</span><span class="identifier">factorial</span><span class="delimiter">(</span><span class="integer">5</span><span class="delimiter">)</span><span class="delimiter">)</span></pre>
  </body>
</html>
